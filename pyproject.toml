[project]
name = "gg-vault"
version = "0.1.0"
description = "A website for tracking the video games you own and want"
readme = "README.md"
authors = [
    { name = "1nder", email = "20195347+1nderr@users.noreply.github.com" }
]
requires-python = ">=3.8"
dependencies = [
    "bcrypt==3.2.0",
    "flask==1.1.2",
    "flask-cors==3.0.10",
    "gunicorn==20.1.0",
    "pyjwt==1.7.1",
    "requests==2.22.0",
]

[tool.uv]
# Flask 1.1.2 breaks with the 2.x/3.x releases of its own dependencies
constraint-dependencies = [
    "itsdangerous<2.0",
    "jinja2<3.0",
    "markupsafe<2.1",
    "werkzeug<2.0",
]
